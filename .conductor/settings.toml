"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
if [ -f package-lock.json ]; then
  npm ci
elif [ -f package.json ]; then
  npm install
fi
"""
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.test]
command = "npm test"
icon = "test-tube"

[prompts]
general = "Read AGENTS.md and docs before editing. Keep financial projections distinct from approved money. Never deploy or create external resources without explicit user approval."
code_review = "Prioritize authorization, money invariants, versioned package truth, missing tests, and visible product regressions."

